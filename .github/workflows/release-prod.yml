name: Production Release
on:
  workflow_dispatch:
    inputs:
      run_publish:
        description: 'Run publish job'
        type: boolean
        default: true
      run_something_else:
        description: 'Run other job'
        type: boolean
        default: false

jobs:
  publish:
    if: ${{ inputs.run_publish }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello from the hello job"


