name: Setup Environments
description: 'Setting up Git, NodeJS and authenticate.'

runs:
  using: 'composite'
  steps:
    - name: Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      shell: 'bash'

    # Do not enable setup-node dependency caching for this step.
    # Caching will be handled by the cache step below.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    # npm OIDC trusted publishing requires npm >= 11.5.1. Node 24 may bundle an
    # older npm, and OIDC fails *silently* (falls back to token auth) if too old.
    # Fail fast here rather than ship an unsigned/token-auth publish.
    - name: Verify npm supports OIDC trusted publishing
      shell: 'bash'
      run: |
        required="11.5.1"
        current="$(npm --version)"
        echo "npm version: $current (required >= $required)"
        lowest="$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)"
        if [ "$lowest" != "$required" ]; then
          echo "::error::npm $current is too old for OIDC trusted publishing; need >= $required. Bump the Node/npm version in .github/actions/prepare."
          exit 1
        fi

    - name: Hash workspace keys
      id: workspace-keys
      run: |
        WORKSPACE_KEYS_HASH="$(node ./scripts/workspace-keys-hash/command.mjs)"
        echo "hash=$WORKSPACE_KEYS_HASH" >> "$GITHUB_OUTPUT"
      shell: 'bash'

    - name: Cache dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}-${{ steps.workspace-keys.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Install packages
      if: steps.cache.outputs.cache-hit != 'true'
      run: yarn install --frozen-lockfile
      shell: 'bash'
    - name: Call prepare on cache hit
      if: steps.cache.outputs.cache-hit != 'false'
      run: yarn prepare
      shell: 'bash'
